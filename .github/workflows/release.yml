name: Publish application update
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: application-release
  cancel-in-progress: false
jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r kodlar/requirements.txt
      - name: Test Windows application
        shell: pwsh
        run: |
          python -m unittest discover -s kodlar/tests -v *> test-output.txt
          $testExit = $LASTEXITCODE
          Get-Content test-output.txt
          "``````text" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Get-Content test-output.txt -Tail 110 | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "``````" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          exit $testExit
  release:
    needs: windows-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build release package
        id: package
        run: |
          version=$(python -c 'from kodlar import __version__; print(__version__)')
          python scripts/build_release.py "$version" /tmp/arik-release
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish ZIP and integrity manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if ! gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release create "v$RELEASE_VERSION" --target "$GITHUB_SHA" --title "Arık Makro $RELEASE_VERSION" --generate-notes --draft
          fi
          gh release upload "v$RELEASE_VERSION" /tmp/arik-release/arik-makro.zip /tmp/arik-release/update.json --clobber
          gh release edit "v$RELEASE_VERSION" --draft=false --latest
