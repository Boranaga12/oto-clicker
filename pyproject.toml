[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "arik-makro"
version = "2.1.7"
description = "Windows için profilli ve piksel izlemeli masaüstü makro uygulaması"
readme = "kodlar/README.md"
requires-python = ">=3.10"
dependencies = [
    "pynput>=1.7.6,<2.0",
]

[project.scripts]
arik-makro = "kodlar.main:main"

[tool.setuptools]
packages = ["kodlar"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.setuptools.package-data]
kodlar = ["assets/*.png", "assets/*.ico", "assets/*.svg"]
